services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR: mirrors.tuna.tsinghua.edu.cn
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    container_name: mcp
    restart: unless-stopped
    shm_size: '4gb'
    volumes:
      - ./:/app:rw
      - mcp_config:/app/config:rw
    ports:
      # 2026-10-06：跟本地口径统一成 8000。旧的 8876:8000 映射正是历史故障的源头
      # （服务端默认 8000、宿主指 8876 → “论坛工具找不到”类静默连不上，见 start_wq_mcp.py docstring）
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_TRANSPORT=streamable-http
      # 2026-10-06：Redis 已移除（缓存走 SQLite / 无缓存），不再注入 REDIS_HOST/REDIS_PORT
      - MCP_CONFIG_FILE=/app/config/user_config.json
    dns:
      - 10.255.255.254
      - 223.5.5.5
      - 119.29.29.29
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

volumes:
  mcp_config:
