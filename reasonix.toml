        r = s.get(\"https://api.worldquantbrain.com/data-fields\", params={\n                \"instrumentType\": \"EQUITY\", \"region\": region, \"delay\": 1, \"universe\": uni,\n                \"limit\": \"100\", \"offset\": \"0\", \"dataset.id\": dsid, \"theme\": \"false\"}, timeout=30)\n            d = r.json()\n            res = d.get(\"results\", []) if isinstance(d, dict) else (d if isinstance(d, list) else [])\n            maxcov = max((f.get(\"coverage\") or 0 for f in res if isinstance(f, dict)), default=0)\n            ncov = sum(1 for f in res if isinstance(f, dict) and (f.get(\"coverage\") or 0) >= 0.8)\n            flag = \"✅\" if maxcov >= 0.8 else \"❌\"\n            if maxcov >= 0.8:\n                found += 1\n                print(f\"  {flag} {dsid:34s} maxCov={maxcov:.2f} n>=0.8: {ncov}/{len(res)}\")\n            else:\n                print(f\"  {flag} {dsid:34s} maxCov={maxcov:.3f} ({len(res)}字段)\")\n        except Exception as e:\n            print(f\"  ⚠️ {dsid}: {e}\")\n        time.sleep(0.25)\n    print(f\"共 {found} 个真正可用\")\nEOF\npython _tmp_fieldcheck.py 2>&1 | head -70", "Bash=cd /d/coding/traeCN_project/wqb && python - <<'EOF'\n# 修正脚本：纯 ASCII 输出\nsrc = open(\"_tmp_fieldcheck.py\", encoding=\"utf-8\").read()\nsrc = src.replace('\"✅\"', '\"OK\"').replace('\"❌\"', '\"NO\"').replace('\"⚠️\"', '\"WARN\"')\nsrc = src.replace('\"\\u274c\"', '\"NO\"').replace('\"\\u26a0\\ufe0f\"', '\"WARN\"')\n# 移除 emoji 在 f-string 里的使用，改成 OK/NO\nsrc = src.replace('flag = \"✅\" if maxcov >= 0.8 else \"❌\"', 'flag = \"OK\" if maxcov >= 0.8 else \"NO\"')\nsrc = src.replace('f\"  {flag} {dsid:34s} maxCov={maxcov:.3f} ({len(res)}字段)\"', 'f\"  {flag} {dsid:34s} maxCov={maxcov:.3f} (fields={len(res)})\"')\nsrc = src.replace('f\"  {flag} {dsid:34s} maxCov={maxcov:.2f} n>=0.8: {ncov}/{len(res)}\"', 'f\"  {flag} {dsid:34s} maxCov={maxcov:.2f} n>=0.8: {ncov}/{len(res)}\"')\nopen(\"_tmp_fieldcheck.py\", \"w\", encoding=\"utf-8\").write(src)\nprint(\"patched\")\nEOF\npyth