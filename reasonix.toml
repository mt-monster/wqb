int(f\"  {k:24s} {v:3d} 个数据集\")\n# IND 体检?\nind = [n for n in names if \"_IND_\" in n or \"_TWN_\" in n or \"_HKG_\" in n or \"_AMR_\" in n]\nprint(f\"\\nIND/TWN/HKG/AMR 体检 bin 数: {len(ind)}\")\nfor n in ind[:10]: print(\"  \", n)\nEOF", "Bash=cd \"D:\\coding\\traeCN_project\\wqb\" && python - <<'EOF'\nimport zipfile, collections\nz = zipfile.ZipFile(\"WebData_20260219_V0.10.9.zip\")\nnames = z.namelist()\ncov = collections.Counter()\nregions = collections.Counter()\nfor n in names:\n    if n.startswith(\"data/oth/\") or n.endswith(\".json\") or \"/\" not in n: continue\n    fn = n.split(\"/\")[-1].replace(\".bin\",\"\")\n    parts = fn.split(\"_\")\n    universe = parts[-2]; region = parts[-3]\n    cov[f\"{region}_{universe}\"] += 1\n    regions[region] += 1\nprint(\"=== 体检 bin 的 region_universe 覆盖 ===\")\nfor k, v in sorted(cov.items(), key=lambda x:-x[1]):\n    print(f\"  {k:24s} {v:3d} 个数据集\")\nprint(\"\\n=== 按 region 汇总 ===\")\nfor k, v in sorted(regions.items(), key=lambda x:-x[1]):\n    print(f\"  {k:6s} {v:3d} 个体检数据集\")\nEOF", "Bash=cd \"D:\\coding\\traeCN_project\\wqb\" && python - <<'EOF'\nimport zipfile, zlib, msgpack\nz = zipfile.ZipFile(\"WebData_20260219_V0.10.9.zip\")\ninfo = msgpack.unpackb(zlib.decompress(z.read(\"data/oth/info_data.bin\")), strict_map_key=False)\nosis = msgpack.unpackb(zlib.decompress(z.read(\"data/oth/osis_data.bin\")), strict_map_key=False)\n\n# 文档断言抽查\nchecks = []\ndef ck(name, actual, doc):\n    ok = abs(actual - doc) < 0.005\n    checks.append((name, actual, doc, ok))\n\n# C: 区域均值\nck(\"IND_1 均值\", info[\"IND_1\"][\"isos\"][\"mean\"][\"sharpe_ratio\"], 0.668)\nck(\"CHN_0 均值\", info[\"CHN_0\"][\"isos\"][\"mean\"][\"sharpe_ratio\"], 0.784)\nck(\"EUR_0 均值\", info[\"EUR_0\"][\"isos\"][\"mean\"][\"sharpe_ratio\"], 0.582)\nck(\"USA_1 均值\", info[\"USA_1\"][\"isos\"][\"mean\"][\"sharpe_ratio\"], 0.358)\nck(\"IND model243\", info[\"IND_1\"][\"isos\"][\"dataset\"][\"model243\"][\"sharpe_ratio\"], 1.085)\nck(\"IND model77\", info[\"IND_1