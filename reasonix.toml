sets?region=GBR&limit=100\", timeout=60)\ndata = r.json()\nresults = data.get(\"results\", [])\nprint(\"GBR 数据集总数:\", len(results))\nprint()\n# 排序：按用户使用度低 + 有字段\nrows = []\nfor d in results:\n    dsid = d.get(\"id\")\n    cov = d.get(\"coverage\", 0)\n    ac = d.get(\"alphaCount\", 0)\n    uc = d.get(\"userCount\", 0)\n    # 取字段数\n    fields = 0\n    try:\n        fr = s.get(f\"https://api.worldquantbrain.com/data-fields?dataset.id={dsid}&region=GBR&delay=1&universe=TOP700&limit=1\", timeout=30)\n        fj = fr.json()\n        if isinstance(fj, dict):\n            fields = fj.get(\"count\", fj.get(\"results\", []).__len__() if isinstance(fj.get(\"results\"), list) else 0)\n    except Exception:\n        pass\n    rows.append((dsid, cov, ac, uc, fields))\nrows.sort(key=lambda x: x[4], reverse=True)\nfor dsid, cov, ac, uc, fields in rows:\n    mark = \" <<<\" if cov >= 0.85 and fields >= 5 and ac <= 80 else \"\"\n    print(f\"{dsid:35s} cov={cov:.3f} fields={fields:3d} alphaCount={ac:5d} users={uc:4d}{mark}\")\nEOF", "Bash=cd /d/coding/traeCN_project/wqb && cat > _tmp_healthcheck.py <<'EOF'\nimport requests, json, time, sys\ns = requests.Session()\nr = s.post(\"https://api.worldquantbrain.com/authentication\", auth=(\"mthyzx@126.com\", \"asdqwe123!\"), timeout=30)\nassert r.status_code == 201, r.status_code\n\ndef get_ds(region, universe):\n    out = []\n    url = f\"https://api.worldquantbrain.com/data-sets?region={region}&limit=100\"\n    while url:\n        rr = s.get(url, timeout=60)\n        d = rr.json()\n        if isinstance(d, dict):\n            out.extend(d.get(\"results\", []))\n            url = d.get(\"next\")\n            if url and not url.startswith(\"http\"):\n                url = \"https://api.worldquantbrain.com\" + url\n        else:\n            out.extend(d)\n            url = None\n    return out\n\nrows = []\nfor region, uni in [(\"GBR\", \"TOP700\"), (\"EUR\", \"TOP800\")]:\n    for ds in get_ds(region, uni):\n        dsid = ds.get(\"id\")\