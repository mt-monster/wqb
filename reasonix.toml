nt\") or 0) >= 5]\nprint(f\"GBR 稀有候选 {len(cands)} 个\")\nfound = []\nfor ds in cands:\n    dsid = ds.get(\"id\")\n    try:\n        r = s.get(\"https://api.worldquantbrain.com/data-fields\", params={\n            \"instrumentType\": \"EQUITY\", \"region\": \"GBR\", \"delay\": 1, \"universe\": \"TOP700\",\n            \"limit\": \"50\", \"offset\": \"0\", \"dataset.id\": dsid, \"theme\": \"false\"}, timeout=30)\n        d = r.json()\n        res = d.get(\"results\", []) if isinstance(d, dict) else (d if isinstance(d, list) else [])\n        if isinstance(d, list) and len(d) == 1 and isinstance(d[0], str):\n            # 错误消息\n            print(f\"  ERR {dsid}: {d[0][:60]}\")\n            continue\n        maxcov = max((f.get(\"coverage\") or 0 for f in res if isinstance(f, dict)), default=0)\n        ncov = sum(1 for f in res if isinstance(f, dict) and (f.get(\"coverage\") or 0) >= 0.8)\n        status = \"OK\" if maxcov >= 0.8 else \"NO\"\n        print(f\"  {status} {dsid:34s} maxCov={maxcov:.3f} fields={len(res)} n>=0.8:{ncov}\")\n        if maxcov >= 0.8:\n            found.append((dsid, maxcov, ncov))\n    except Exception as e:\n        print(f\"  WARN {dsid}: {e}\")\n    time.sleep(0.25)\nprint(\"\\n真正可用:\", found if found else \"无\")\nEOF", "Bash=cd /d/coding/traeCN_project/wqb && cat > _tmp_gbr_all.py <<'EOF'\nimport requests, time\ns = requests.Session()\ns.post(\"https://api.worldquantbrain.com/authentication\", auth=(\"mthyzx@126.com\", \"asdqwe123!\"), timeout=30)\n\ndef get_ds(region):\n    out, url = [], f\"https://api.worldquantbrain.com/data-sets?region={region}&limit=50&delay=1\"\n    pages = 0\n    while url and pages < 20:\n        rr = s.get(url, timeout=60)\n        d = rr.json()\n        res = d.get(\"results\", []) if isinstance(d, dict) else d\n        for item in res:\n            if isinstance(item, dict) and item.get(\"delay\") == 1:\n                out.append(item)\n        nxt = d.get(\"next\") if isinstance(d, dict) else None\n        if nxt and not nxt.startswith(\"http\"):\n            nxt = \"https://api.worldquantbrain.com\" + nxt\n        url = nxt; pages += 1\n    return out\n\ndslist = get_ds(\"GBR\")\nprint(f\"GBR delay1 数据集总数: {len(dslist)}\")\n\ntried = {\"other455\",\"pattern_scores\",\"model264\",\"analyst_earnings_ibes\",\"news104\",\n         \"institutions6\",\"fund_holdings_panel\",\"sentiment27\",\"shortinterest3\",\"pv29\",\n         \"risk88\",\"analyst48\",\"oth296\"}\nrows = []\nfor ds in dslist:\n    dsid = ds.get(\"id\")\n    if dsid in tried:\n        continue\n    ac = ds.get(\"alphaCount\") or 0\n    fc = ds.get(\"fieldCount\") or 0\n    try:\n        r = s.get(\"https://api.worldquantbrain.com/data-fields\", params={\n            \"instrumentType\": \"EQUITY\", \"region\": \"GBR\", \"delay\": 1, \"universe\": \"TOP700\",\n            \"limit\": \"50\", \"offset\": \"0\", \"dataset.id\": dsid, \"theme\": \"false\"}, timeout=30)\n        d = r.json()\n        if isinstance(d, list) and len(d) == 1 and isinstance(d[0], str):\n            rows.append((dsid, 0.0, 0, ac, fc, \"ERR:\"+d[0][:30]))\n            continue\n        res = d.get(\"results\", []) if isinstance(d, dict) else (d if isinstance(d, list) else [])\n        maxcov = max((f.get(\"coverage\") or 0 for f in res if isinstance(f, dict)), default=0)\n        ncov = sum(1 for f in res if isinstance(f, dict) and (f.get(\"coverage\") or 0) >= 0.8)\n        rows.append((dsid, maxcov, ncov, ac, fc, \"\"))\n    except Exception as e:\n        rows.append((dsid, 0.0, 0, ac, fc, \"EX:\"+str(e)[:30]))\n    time.sleep(0.2)\n\nrows.sort(key=lambda x: -x[1])\nprint(f\"\\n未试过的 GBR 数据集（按 maxCov 降序）: {len(rows)} 个\")\nfor dsid, maxcov, ncov, ac, fc, err in rows:\n    flag = \"OK\" if maxcov >= 0.8 else (\"PART\" if maxcov >= 0.5 else \"NO\")\n    extra = f\" alphaCount={ac} fieldCount={fc}\" if not err else f\" {err}\"\n    print(f\"  {flag} {dsid:36s} maxCov={maxcov:.3f} n>=0.8:{ncov}{extra}\")\nEOF\npython _tmp_gbr_all.py > _tm