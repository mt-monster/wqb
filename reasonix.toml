allow = ["Bash=cd /d/coding/traeCN_project/wqb && for f in .zcode/skills/*/SKILL.md .workbuddy/skills/*/SKILL.md wqb-share-03/.trae/skills/*/SKILL.md; do echo \"=== $f ===\"; head -8 \"$f\"; echo; done", "install_source", "Bash=cd /d/coding/traeCN_project/wqb && echo \"=== frontmatter 完整性检查 ===\" && for f in .workbuddy/skills/*/SKILL.md; do name=$(sed -n 's/^name:[[:space:]]*//p' \"$f\" | head -1); desc=$(sed -n 's/^description:[[:space:]]*//p' \"$f\" | head -1); if [ -n \"$name\" ] && [ -n \"$desc\" ]; then echo \"OK  $f -> name=$name | desc_len=${#desc}\"; else echo \"BAD $f -> name=[$name] desc_len=[${#desc}]\"; fi; done && echo && echo \"=== SKILL.md 中引用的 references 文件是否都存在 ===\" && for f in .workbuddy/skills/*/SKILL.md; do dir=$(dirname \"$f\"); for ref in $(grep -oE 'references/[A-Za-z0-9._-]+\\.md' \"$f\" | sort -u); do if [ -f \"$dir/$ref\" ]; then echo \"OK   $dir/$ref\"; else echo \"MISS $dir/$ref\"; fi; done; done", "Bash=cd /d/coding/traeCN_project/wqb && cp .workbuddy/skills/brain-alpha-orchestrator/references/backtest-experience-archive.md .workbuddy/skills/brain-alpha-research/references/backtest-experience-archive.md && echo \"copied\" && ls -la .workbuddy/skills/brain-alpha-research/references/", "Bash=cd /d/coding/traeCN_project/wqb && echo \"=== 1. 全部链接引用解析检查 ===\" && ok=1; for f in .workbuddy/skills/*/SKILL.md .workbuddy/skills/*/references/*.md; do dir=$(dirname \"$f\"); for ref in $(grep -oE '\\]\\([^)]+\\.md\\)' \"$f\" | sed 's/](//;s/)//' | grep -v '^http' | sort -u); do # 规范化路径（去掉 ./ 和 #anchor）\n  clean=\"${ref%%#*}\"; clean=\"${clean#./}\";\n  if [ -f \"$dir/$clean\" ]; then :; else echo \"MISS($f): $ref\"; ok=0; fi\ndone; done; [ $ok -eq 1 ] && echo \"全部链接引用 OK\" && echo && echo \"=== 2. [[双链]] 引用检查 ===\" && ok2=1; for f in .workbuddy/skills/*/references/*.md; do dir=$(dirname \"$f\"); for link in $(grep -oE '\\[\\[[A-Za-z0-9._-]+\\.md\\]\\]' \"$f\" | sed 's/\\[\\[//;s/\\]\\]//' | sort -u); do if [ -f \"$dir/$link\" ]; then :; else echo \"MISS($f): [[$link]]\"; ok2=0; fi; done; done; [ $ok2 -eq 1 ] && echo \"全部双链引用 OK\" && echo && echo \"=== 3. 反向链接检查（SKILL.md 是否被 references 引用）===\" && echo \"(双链检查已覆盖)\"", "Bash=cd /d/coding/traeCN_project/wqb && echo \"=== 所有被 skill 引用的项目相对路径（markdown 链接 + 反引号路径 + python/命令） ===\" && grep -rhoE '\\]\\(\\.\\.?/\\.\\.?/[^)]+\\)|`\\.\\.?/\\.\\.?/[^`]+`' .workbuddy/skills --include=*.md | sed 's/^](//;s/)$//;s/^`//;s/`$//' | sort -u"]


