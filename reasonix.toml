tion as e:\n            print(\"err:\", e); break\n        for item in parse_results(d):\n            if isinstance(item, dict) and item.get(\"delay\") == 1:\n                out.append(item)\n        nxt = None\n        if isinstance(d, dict):\n            nxt = d.get(\"next\")\n            if nxt and not nxt.startswith(\"http\"):\n                nxt = \"https://api.worldquantbrain.com\" + nxt\n        url = nxt\n        pages += 1\n    return out\n\nfor region in [\"GBR\", \"EUR\"]:\n    print(f\"\\n===== {region} 全部数据集(delay=1):\", end=\" \")\n    dslist = get_ds(region)\n    print(len(dslist))\n    rows = []\n    for ds in dslist:\n        try:\n            rows.append((ds.get(\"id\"), ds.get(\"dateCoverage\") or 0, ds.get(\"fieldCount\") or 0,\n                         ds.get(\"alphaCount\") or 0, ds.get(\"userCount\") or 0, ds.get(\"valueScore\") or 0))\n        except Exception:\n            pass\n    rows.sort(key=lambda t: (-t[1], t[3]))\n    print(\"  dateCov>=0.9 且 alphaCount<=5 且 fieldCount>=5:\")\n    for x in rows:\n        if x[1] >= 0.9 and x[3] <= 5 and x[2] >= 5:\n            print(f\"    {str(x[0])[:38]:38s} dateCov={x[1]:.2f} fields={x[2]:3d} alphaCount={x[3]:3d} users={x[4]:3d} val={x[5]}\")\nEOF\npython _tmp_healthcheck.py", "Bash=cd /d/coding/traeCN_project/wqb && cat > _tmp_fieldcheck.py <<'EOF'\nimport requests, json, time\ns = requests.Session()\ns.post(\"https://api.worldquantbrain.com/authentication\", auth=(\"mthyzx@126.com\", \"asdqwe123!\"), timeout=30)\n\ndef get_ds(region):\n    out, url = [], f\"https://api.worldquantbrain.com/data-sets?region={region}&limit=50&delay=1\"\n    pages = 0\n    while url and pages < 20:\n        rr = s.get(url, timeout=60)\n        d = rr.json()\n        res = d.get(\"results\", []) if isinstance(d, dict) else d\n        for item in res:\n            if isinstance(item, dict) and item.get(\"delay\") == 1:\n                out.append(item)\n        nxt = d.get(\"next\") if isinstance(d, dict) else None\n        if nxt and not nxt.startswith(\"http\"):\n            nxt = \"https://api.worldquantbrain.com\" + nxt\n        url = nxt; pages += 1\n    return out\n\n# GBR 候选：alphaCount<=10 且 fieldCount>=5，逐个查字段真实覆盖\nfor region, uni in [(\"GBR\", \"TOP700\")]:\n    dslist = get_ds(region)\n    print(f\"=== {region} alphaCount<=10 数据集真实字段覆盖 ===\")\n    cands = []\n    for ds in dslist:\n        ac = ds.get(\"alphaCount\") or 0\n        fc = ds.get(\"fieldCount\") or 0\n        if ac <= 10 and fc >= 5:\n            cands.append(ds)\n    print(f\"候选 {len(cands)} 个，逐查 data-fields coverage...\")\n    for ds in cands:\n        dsid = ds.get(\"id\")\n        try:\n            r = s.get(f\"https://api.worldquantbrain.com/data-fields?dataset.id={dsid}&region={region}&delay=1&universe={uni}&limit=100\", timeout=30)\n            d = r.json()\n            res = d.get(\"results\", []) if isinstance(d, dict) else d\n            maxcov = 0.0\n            ncov = 0\n            for f in res:\n                if isinstance(f, dict):\n                    c = f.get(\"coverage\") or 0\n                    if c > maxcov: maxcov = c\n                    if c >= 0.8: ncov += 1\n            if maxcov >= 0.8:\n                print(f\"  ✅ {dsid:34s} maxCov={maxcov:.2f} fields≥0.8: {ncov}/{len(res)}\")\n        except Exception as e:\n            print(f\"  ⚠️ {dsid}: {e}\")\n        time.sleep(0.3)\nEOF\npython _tmp_fieldcheck.py 2>&1 | head -60", "Bash=cd /d/coding/traeCN_project/wqb && python - <<'EOF'\nimport requests, time\ns = requests.Session()\ns.post(\"https://api.worldquantbrain.com/authentication\", auth=(\"mthyzx@126.com\", \"asdqwe123!\"), timeout=30)\n# 直接测一个已知数据集\nr = s.get(\"https://api.worldquantbrain.com/data-fields?dataset.id=analyst_earnings_ibes&region=GBR&delay=1&universe=TOP700&limit=100\", timeout=30)\nprint(\"status:\", r.status_code)\nd = r.json()\nprint(\"type:\", type(d))\nres = d.get(\"results\", []) if isinstance(d, dict) else d\nprint(\"count:\", len(res))\nfor f in 