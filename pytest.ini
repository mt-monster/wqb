[pytest]
testpaths = tests world-quant-brain-mcp/tests
# -n auto：用本机 CPU 核数并行跑测试（2026-11-16 优化）。耗时分散在 285 个
# 测试文件的 setup/teardown 上、无单个慢用例，并行是最大压缩杠杆（全量 ~3-7min → 1-2min）。
# 依赖 pytest-xdist（见 requirements.txt）。若个别测试不幂等导致并行下失败，
# 用 `-p no:xdist` 或 `-n 0` 退回串行，再对该用例加 `@pytest.mark.xdist_group`。
addopts = -ra -n auto --junitxml=logs/test-results.xml
