# pyproject.toml — wqb 项目元数据与依赖集中声明（2026-08-18 新增）
#
# 目的：作为依赖与项目元数据的单一可发现入口（IDE / pip / 安全扫描器读取），
# 与根 requirements.txt 保持同源（requirements.txt 仍是安装入口，见其注释）。
# 测试配置仍以 pytest.ini 为准，本文件不重复 [tool.pytest.ini_options]，避免冲突。
#
# 注意：`src/wqb` 声明为可安装包（`pip install -e .` 后 `import wqb` 在任意目录
# 可用），但 tools/ 与 Claude/skills/ 仍是脚本、不打包。因此 `pip install -e .`
# 同时起两个作用：装依赖 + 把 wqb 包挂进 venv。tools/ 里的 CLI 仍靠
# `python tools/<x>.py` 直接运行，其 sys.path 引导代码暂留未删（存量清理见
# AGENTS.md §结构维护）。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wqb"
version = "0.1.0"
description = "WorldQuant BRAIN Alpha 挖掘工作区（仿真/相关性/提交/台账 pipeline）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # —— MCP 服务端 + 工具链运行时（与 world-quant-brain-mcp/requirements.txt 同源）——
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "redis>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    # —— 开发 / 测试 ——
    "pytest>=8.0.0",
]

# 本仓库主体是脚本集合，但 `src/wqb` 是一个规整的可导入包（每个子包都有
# __init__.py），因此这里真正声明它 —— 目的是让 `import wqb` 在任何工作目录
# 都能用，不必靠 259 处 sys.path 注入（见 AGENTS.md「依赖只允许向下」）。
#
# 注意：tools/ 与 Claude/skills/ 仍是脚本，不打包。tools/ 里的 CLI 靠
# `python tools/<x>.py` 直接运行，其 sys.path 引导代码暂留（见下方注释）。
[tool.setuptools]
# 只装 src/wqb；显式 include 避免把 src/logs（运行期日志误落点）一并扫进来。
[tool.setuptools.packages.find]
where = ["src"]
include = ["wqb*"]
