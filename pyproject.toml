# pyproject.toml — wqb 项目元数据与依赖集中声明（2026-08-18 新增）
#
# 目的：作为依赖与项目元数据的单一可发现入口（IDE / pip / 安全扫描器读取），
# 与根 requirements.txt 保持同源（requirements.txt 仍是安装入口，见其注释）。
# 测试配置仍以 pytest.ini 为准，本文件不重复 [tool.pytest.ini_options]，避免冲突。
#
# 注意：本仓库是脚本/工具集合而非可 pip 安装的库，未声明 packages，
# 因此 `pip install -e .` 仅用于安装依赖；运行时脚本通过 sys.path 注入或 venv 直接调用。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wqb"
version = "0.1.0"
description = "WorldQuant BRAIN Alpha 挖掘工作区（仿真/相关性/提交/台账 pipeline）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # —— MCP 服务端 + 工具链运行时（与 world-quant-brain-mcp/requirements.txt 同源）——
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "redis>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    # —— 开发 / 测试 ——
    "pytest>=8.0.0",
]

[tool.setuptools]
# 仓库为脚本集合，不打包为可导入库；仅声明依赖元数据。
py-modules = []
